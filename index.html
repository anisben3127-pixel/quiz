<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>QuizLive – Questionnaires en direct</title>
<style>
:root{--p:#6d5dfc;--p2:#ff6bb5;--ink:#22204a;--ok:#1fb67a;--ko:#f0506e}
*{box-sizing:border-box}
body{margin:0;padding:16px;min-height:100vh;font-family:system-ui,"Segoe UI",Roboto,sans-serif;color:var(--ink);background:linear-gradient(135deg,#6d5dfc,#ff6bb5 60%,#ffb86b) fixed}
.w{max-width:700px;margin:0 auto}
h1{color:#fff;text-align:center;margin:8px 0 2px;font-size:2.1rem;text-shadow:0 3px 10px #0003}
.sub{color:#fff;text-align:center;opacity:.92;margin:0 0 14px}
.c{background:#fff;border-radius:20px;padding:20px;margin:14px 0;box-shadow:0 10px 30px #0002;animation:pop .35s ease}
@keyframes pop{from{transform:translateY(12px);opacity:0}to{transform:none;opacity:1}}
h3{margin:0 0 8px}
button{font:inherit;border:0;border-radius:12px;padding:12px 18px;background:var(--p);color:#fff;font-weight:700;cursor:pointer;margin:4px 4px 4px 0}
button.s{background:#ece9ff;color:var(--p)}button.g{background:var(--ok)}button.r{background:var(--ko)}button.sm{padding:4px 10px}
input,textarea,select{font:inherit;width:100%;padding:12px;border:2px solid #e0dcff;border-radius:12px;margin:6px 0;background:#fff;color:var(--ink)}
input[type=checkbox]{width:24px;height:24px;margin:0;flex:none;accent-color:var(--p)}
.row,.chk{display:flex;gap:10px;align-items:center}
.row input.ct{margin:4px 0}
.chk{background:#f4f2ff;border-radius:12px;padding:12px;margin:8px 0;cursor:pointer}
.qb{border:2px solid #ece9ff;border-radius:16px;padding:14px;margin:12px 0}
.bar{height:28px;border-radius:9px;background:#ece9ff;margin:6px 0;position:relative;overflow:hidden}
.bar i{position:absolute;inset:0 auto 0 0;background:linear-gradient(90deg,var(--p),var(--p2));opacity:.55}
.bar b{position:relative;padding:0 10px;line-height:28px;font-size:.9rem}
.big{font-size:1.3rem;font-weight:800;margin:8px 0}
.mix{letter-spacing:.25em;font-size:1.8rem;font-weight:900;color:var(--p);text-align:center;word-break:break-word}
.tag{display:inline-block;background:#ece9ff;color:var(--p);border-radius:99px;padding:3px 12px;font-size:.8rem;font-weight:700}
.pill{display:inline-block;background:#f4f2ff;border-radius:12px;padding:5px 12px;margin:3px;font-size:.88rem}
.res{padding:10px 12px;border-radius:12px;margin:6px 0;background:#f4f2ff}
.res.ok{background:#d6f5e8;color:#0b7a50;font-weight:700}.res.ko{background:#fde0e6;color:#b3223f;font-weight:700}.res.nt{background:#fff3d6;color:#8a5a00}
small{color:#6b688f}
#st{text-align:center;color:#fff;font-size:.8rem;opacity:.85}
</style>
</head>
<body>
<div class="w">
  <h1>🎉 QuizLive</h1>
  <p class="sub">Questionnaires, QCM &amp; jeux de mots en direct</p>
  <div id="app"></div>
  <p id="st"></p>
</div>
<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const nz=s=>String(s??"").normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase().replace(/[^a-z0-9]/g,"");
const arr=x=>x==null?[]:Object.values(x);
const nums=x=>arr(x).map(Number);
const P=new URLSearchParams(location.search);
let DB=P.get("db")||"",ROOM=P.get("r")||"",ANIM=P.get("m")==="anim";
const SID=localStorage.getItem("ql_sid")||(()=>{const s=Math.random().toString(36).slice(2,9);localStorage.setItem("ql_sid",s);return s})();
let NAME=localStorage.getItem("ql_name")||"",room={qs:{},a:{}},last="",cur=0,ans={};
const LAB={qcm:"QCM",text:"Réponse libre",mix:"Mot mélangé"};

/* ---------- Stockage : Firebase (REST) ou local (test) ---------- */
const base=()=>DB.replace(/\/$/,"")+"/rooms/"+ROOM;
const seg=p=>p.split("/").filter(Boolean);
const lget=(o,p)=>{for(const k of seg(p)){if(o==null)return null;o=o[k]}return o??null};
function lset(o,p,v){o=o||{};let c=o;const s=seg(p);s.forEach((k,i)=>{if(i===s.length-1)c[k]=v;else c=c[k]=c[k]||{}});return o}
const lk=()=>"ql_room_"+ROOM;
async function get(p=""){
  if(DB){const r=await fetch(base()+p+".json");return r.json()}
  return lget(JSON.parse(localStorage.getItem(lk())||"null"),p);
}
async function put(p,v){
  if(DB){await fetch(base()+p+".json",{method:"PUT",body:JSON.stringify(v)})}
  else localStorage.setItem(lk(),JSON.stringify(lset(JSON.parse(localStorage.getItem(lk())||"null"),p,v)));
}

/* ---------- Outils ---------- */
const qids=r=>Object.keys(r.qs||{}).filter(k=>r.qs[k]).sort();
const scorable=q=>q.type==="qcm"?arr(q.ans).length>0:q.ans!==undefined;
function ok(q,v){
  if(v==null||!q)return false;
  if(q.type==="qcm"){const a=nums(q.ans).sort().join(),b=nums(v).sort().join();return a!==""&&a===b}
  return q.ans!==undefined&&String(q.ans).split("|").some(x=>nz(x)===nz(v));
}
const shuf=t=>{const a=t.toUpperCase().replace(/\s+/g," ").split("");let b=a;for(let i=0;i<9;i++){b=[...a].sort(()=>Math.random()-.5);if(b.join("")!==a.join(""))break}return b.map(c=>c===" "?"/":c).join(" ")};
const qtext=q=>q.type==="mix"?`<p>Remets les lettres dans l’ordre :</p><div class="mix">${esc(q.mix)}</div>`:`<p class="big">${esc(q.text)}</p>`;
function board(r){
  const L=Object.values(r.a||{}).map(u=>({n:u.n,k:qids(r).filter(id=>ok(r.qs[id],((u.r||{})[id]||{}).v)).length})).sort((a,b)=>b.k-a.k);
  return L.length?"<ol>"+L.map((x,i)=>`<li>${i?"":"🥇 "}${esc(x.n)} — <b>${x.k}</b> pt${x.k>1?"s":""}</li>`).join("")+"</ol>":"";
}

/* ---------- Accueil ---------- */
function home(){
  $("#app").innerHTML=`<div class="c"><h3>🎤 Je suis l’animateur</h3>
  <p><small>Colle l’adresse de ta base Firebase (sans rien après .app ou .com). Laisse vide pour un simple test sur cet appareil.</small></p>
  <input id="fb" placeholder="https://mon-projet-default-rtdb.firebasedatabase.app" value="${esc(localStorage.getItem("ql_db")||"")}">
  <button onclick="mk()">✨ Créer une salle</button></div>
  <div class="c"><h3>🎓 Je suis étudiant</h3><p>Ouvre simplement le lien envoyé par ton animateur.</p></div>`;
}
async function mk(){
  DB=$("#fb").value.trim();localStorage.setItem("ql_db",DB);
  ROOM=Math.random().toString(36).slice(2,6).toUpperCase();ANIM=true;
  try{await put("/meta",{t:Date.now()});await put("/state","draft")}catch(e){return alert("Impossible de joindre la base. Vérifie l’adresse.")}
  const q=new URLSearchParams({r:ROOM});if(DB)q.set("db",DB);q.set("m","anim");
  history.replaceState(null,"","?"+q);start();
}
const link=()=>{const q=new URLSearchParams({r:ROOM});if(DB)q.set("db",DB);return location.href.split("?")[0].split("#")[0]+"?"+q};
const cp=()=>navigator.clipboard.writeText(link()).then(()=>alert("Lien copié ✅"));

/* ---------- Démarrage ---------- */
function start(){
  if(ANIM)teacher();
  else if(!NAME)nameForm();
  else $("#app").innerHTML='<div class="c" id="live"></div>';
  refresh();setInterval(refresh,2000);
}
function nameForm(){
  $("#app").innerHTML=`<div class="c"><h3>👋 Bienvenue !</h3><p>Comment t’appelles-tu ?</p><input id="nm" placeholder="Ton prénom" maxlength="30"><button onclick="setName()">Entrer</button></div>`;
}
function setName(){
  const v=$("#nm").value.trim();if(!v)return;NAME=v;localStorage.setItem("ql_name",v);
  $("#app").innerHTML='<div class="c" id="live"></div>';last="";refresh();
}
async function refresh(){
  if(!ROOM||(!ANIM&&!NAME))return;
  try{
    if(ANIM){
      const r=await get("");
      if(!r||!r.state){$("#st").textContent="Salle introuvable…";return}
      room={qs:{},a:{},...r};
      const sg=JSON.stringify(room);
      if(sg!==last){last=sg;live(room)}
    }else{
      const s=await get("/state");
      if(!s){$("#st").textContent="Salle introuvable…";return}
      if(s!==last){last=s;const r=await get("");room={qs:{},a:{},...r};stud(room)}
    }
    $("#st").textContent="Salle "+ROOM+" · connecté 🟢";
  }catch(e){$("#st").textContent="Connexion impossible 🔴"}
}

/* ---------- Animateur ---------- */
function teacher(){
  $("#app").innerHTML=`<div class="c"><span class="tag">Salle ${ROOM}</span>
  <p><b>Lien à envoyer aux étudiants :</b></p><input readonly value="${esc(link())}" onclick="this.select()">
  <button class="s" onclick="cp()">📋 Copier le lien</button>
  ${DB?"":"<br><small>Mode test : fonctionne seulement entre onglets du même navigateur.</small>"}</div>
  <div class="c" id="live"></div>
  <div class="c"><h3>➕ Ajouter une question</h3>
  <select id="t" onchange="tg()"><option value="qcm">🔘 QCM (cases à cocher)</option><option value="text">💬 Réponse libre / devinette</option><option value="mix">🔤 Mot mélangé (jeu de mots)</option></select>
  <textarea id="qt" rows="2" placeholder="Ta question…"></textarea>
  <div id="qm"><small>Écris les choix et coche la ou les bonnes réponses :</small><div id="rows"></div>
  <button class="s" onclick="addRow()">+ Ajouter un choix</button>
  <label class="chk"><input type="checkbox" id="jf" checked> Demander une justification à l’étudiant</label></div>
  <input id="qa" placeholder="Réponse attendue (plusieurs possibles : séparées par |) — facultatif">
  <button onclick="addQ()">➕ Ajouter au questionnaire</button></div>`;
  tg();for(let i=0;i<4;i++)addRow();
}
function addRow(){$("#rows").insertAdjacentHTML("beforeend",'<div class="row"><input type="checkbox" class="ck"><input class="ct" placeholder="Choix…"></div>')}
function tg(){
  const t=$("#t").value;
  $("#qm").style.display=t==="qcm"?"block":"none";
  $("#qa").style.display=t==="text"?"block":"none";
  $("#qt").placeholder=t==="mix"?"Le mot ou la phrase à mélanger…":"Ta question…";
}
async function addQ(){
  if(room.state!=="draft")return alert("Le questionnaire est déjà lancé.");
  const t=$("#t").value,txt=$("#qt").value.trim();if(!txt)return alert("Écris la question !");
  const q={type:t,text:txt};
  if(t==="qcm"){
    const rows=[...document.querySelectorAll(".row")].map(r=>({c:r.querySelector(".ct").value.trim(),k:r.querySelector(".ck").checked})).filter(x=>x.c);
    if(rows.length<2)return alert("Mets au moins 2 choix.");
    q.choices=rows.map(x=>x.c);q.ans=rows.map((x,i)=>x.k?i:-1).filter(i=>i>=0);
    if(!q.ans.length)return alert("Coche au moins une bonne réponse.");
    q.just=$("#jf").checked;
  }else if(t==="mix"){q.ans=txt;q.mix=shuf(txt)}
  else{const a=$("#qa").value.trim();if(a)q.ans=a}
  const n=Math.max(0,...qids(room).map(k=>+k.slice(1)))+1;
  await put("/qs/q"+String(n).padStart(2,"0"),q);
  $("#qt").value="";$("#qa").value="";$("#rows").innerHTML="";for(let i=0;i<4;i++)addRow();
  last="";refresh();
}
async function del(id){await put("/qs/"+id,null);last="";refresh()}
async function launch(){if(!qids(room).length)return alert("Ajoute au moins une question.");await put("/state","open");last="";refresh()}
async function rev(){const m=prompt("Message avec les corrections (facultatif) :");if(m)await put("/msg",m);await put("/state","revealed");last="";refresh()}
async function endp(){if(confirm("Terminer le sondage ?")){await put("/state","ended");last="";refresh()}}
function stats(r,id,q){
  const U=Object.values(r.a||{}).filter(u=>u.r&&u.r[id]),good=nums(q.ans);let h="";
  if(q.type==="qcm"){
    arr(q.choices).forEach((c,i)=>{
      const k=U.filter(u=>nums(u.r[id].v).includes(i)).length,p=U.length?k/U.length*100:0,g=good.includes(i);
      h+=`<div class="bar"><i style="width:${p}%;${g?"background:var(--ok);opacity:.8":""}"></i><b>${g?"✅ ":""}${esc(c)} — ${k}</b></div>`;
    });
    h+=U.filter(u=>u.r[id].j).map(u=>`<span class="pill">💬 ${esc(u.n)} : ${esc(u.r[id].j)}</span>`).join("");
  }else{
    h+=U.map(u=>`<span class="pill">${esc(u.n)} : <b>${esc(u.r[id].v)}</b></span>`).join("");
    if(q.ans!==undefined)h+=`<p>✅ ${esc(String(q.ans).split("|")[0])}</p>`;
  }
  return h;
}
function live(r){
  const ids=qids(r),S=r.state,U=Object.values(r.a||{});
  let h=`<span class="tag">${{draft:"✏️ Préparation",open:"🟢 En cours",revealed:"👁️ Correction affichée",ended:"🏁 Terminé"}[S]}</span>`;
  if(S!=="draft")h+=`<p>👥 ${U.length} étudiant(s) · ✅ ${U.filter(u=>u.done).length} ont envoyé leurs réponses</p>`;
  if(!ids.length)h+="<p>Aucune question pour l’instant. Ajoute la première ⬇️</p>";
  ids.forEach((id,i)=>{
    const q=r.qs[id];
    h+=`<div class="qb"><b>${i+1}. ${esc(q.type==="mix"?"Mot mélangé : "+q.mix:q.text)}</b> <span class="tag">${LAB[q.type]}</span>${S==="draft"?` <button class="r sm" onclick="del('${id}')">🗑️</button>`:""}${S==="draft"&&q.type==="qcm"?"<br>"+arr(q.choices).map((c,k)=>`<span class="pill">${nums(q.ans).includes(k)?"✅ ":""}${esc(c)}</span>`).join(""):stats(r,id,q)}</div>`;
  });
  if(S==="draft")h+=`<button class="g" onclick="launch()">🚀 Lancer le questionnaire</button>`;
  if(S==="open")h+=`<button class="g" onclick="rev()">👁️ Révéler les corrections</button>`;
  if(S==="open"||S==="revealed")h+=`<button class="r" onclick="endp()">🏁 Fin du sondage</button>`;
  if(S==="ended")h+=`<h3>🏆 Classement</h3>${board(r)}<button class="s" onclick="location.href=location.href.split('?')[0]">🔄 Nouvelle salle</button>`;
  $("#live").innerHTML=h;
}

/* ---------- Étudiant ---------- */
function stud(r){
  const S=r.state,ids=qids(r),me=(r.a||{})[SID];
  if(S==="draft"||!ids.length){$("#live").innerHTML="<h3>⏳ L’animateur prépare le questionnaire…</h3><p><small>Ne ferme pas cette page, elle se met à jour toute seule.</small></p>";return}
  if(S==="open"){
    if(me&&me.done){$("#live").innerHTML="<h3>✅ Réponses envoyées !</h3><p>Attends la correction de l’animateur…</p>";return}
    ans={...(me&&me.r||{}),...ans};showQ();
  }else result(r);
}
function showQ(){
  const ids=qids(room),id=ids[cur],q=room.qs[id],a=ans[id]||{},sel=nums(a.v),lastQ=cur===ids.length-1;
  let h=`<span class="tag">Question ${cur+1} / ${ids.length}</span><div class="bar"><i style="width:${(cur+1)/ids.length*100}%"></i></div>${qtext(q)}`;
  if(q.type==="qcm"){
    h+="<small>Coche une ou plusieurs réponses.</small>"+arr(q.choices).map((c,i)=>`<label class="chk"><input type="checkbox" value="${i}" ${sel.includes(i)?"checked":""} onchange="save()"> ${esc(c)}</label>`).join("");
    if(q.just)h+=`<textarea id="jt" rows="3" placeholder="Justifie ton choix…" oninput="save()">${esc(a.j||"")}</textarea>`;
  }else h+=`<input id="ans" value="${esc(a.v||"")}" oninput="save()" placeholder="Ta réponse…" autocomplete="off">`;
  h+=`<br>${cur?'<button class="s" onclick="go(-1)">← Précédent</button>':""}<button onclick="go(1)">${lastQ?"✅ Envoyer mes réponses":"Suivant →"}</button>`;
  $("#live").innerHTML=h;
}
function save(){
  const id=qids(room)[cur],q=room.qs[id];
  ans[id]=q.type==="qcm"?{v:[...document.querySelectorAll("input[type=checkbox]:checked")].map(x=>+x.value),j:$("#jt")?$("#jt").value:""}:{v:$("#ans").value.trim()};
}
async function go(d){
  save();const ids=qids(room),id=ids[cur];
  put("/a/"+SID+"/n",NAME);put("/a/"+SID+"/r/"+id,ans[id]);
  if(d>0&&cur===ids.length-1){
    const miss=ids.filter(k=>{const a=ans[k];return !a||a.v==null||a.v===""||(Array.isArray(a.v)&&!a.v.length)});
    if(miss.length&&!confirm("Il te reste "+miss.length+" question(s) sans réponse. Envoyer quand même ?"))return;
    await put("/a/"+SID,{n:NAME,r:ans,done:true});last="";return refresh();
  }
  cur=Math.max(0,Math.min(ids.length-1,cur+d));showQ();
}
function result(r){
  const ids=qids(r),me=(r.a||{})[SID]||{},end=r.state==="ended";let pts=0,tot=0,h="";
  ids.forEach((id,i)=>{
    const q=r.qs[id],x=(me.r||{})[id]||{},sc=scorable(q),good=sc&&ok(q,x.v);
    if(sc){tot++;if(good)pts++}
    h+=`<div class="qb"><b>${i+1}. ${esc(q.type==="mix"?"Mot mélangé : "+q.mix:q.text)}</b>`;
    if(q.type==="qcm"){
      h+=arr(q.choices).map((c,k)=>{const m=nums(x.v).includes(k),g=nums(q.ans).includes(k);return `<div class="res ${g?"ok":m?"ko":""}">${m?"👉 ":""}${g?"✅ ":""}${esc(c)}</div>`}).join("");
      if(x.j)h+=`<small>Ta justification : ${esc(x.j)}</small>`;
    }else{
      h+=`<p>Ta réponse : <b>${esc(x.v||"—")}</b></p>`;
      if(q.ans!==undefined)h+=`<div class="res ok">✅ ${esc(String(q.ans).split("|")[0])}</div>`;
    }
    if(sc)h+=`<p>${good?"🎉 Bravo !":"❌ Pas tout à fait"}</p>`;
    h+="</div>";
  });
  $("#live").innerHTML=(end?`<h3>🏁 Sondage terminé, merci ${esc(NAME)} !</h3>`:"<h3>👁️ Correction</h3>")+(tot?`<p class="big">Ton score : ${pts} / ${tot} 🎯</p>`:"")+(r.msg?`<div class="res nt">💬 ${esc(r.msg)}</div>`:"")+h+(end?"<h3>🏆 Classement</h3>"+board(r):"");
}

if(ROOM)start();else home();
</script>
</body>
</html>
